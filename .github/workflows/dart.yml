name: Validate Flutter Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Flutter ${{ matrix.sdk }} / Design UI ${{ matrix.design }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sdk: [minimum, stable]
        design: [oldest, latest]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select Flutter SDK
        id: flutter
        env:
          SDK_TARGET: ${{ matrix.sdk }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = ''
          if os.environ['SDK_TARGET'] == 'minimum':
              pubspec = Path('pubspec.yaml').read_text()
              match = re.search(r'^  flutter: [\'"]?>=(\d+\.\d+\.\d+)[\'"]?$', pubspec, re.MULTILINE)
              if match is None:
                  raise SystemExit('Expected an explicit >=x.y.z Flutter minimum in pubspec.yaml')
              version = match.group(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      - name: Show SDK Versions
        run: |
          flutter --version
          dart --version

      # Resolve anew after selecting the SDK, including the example's own graph.
      # Do not cache .dart_tool: it contains SDK and checkout-specific paths.
      - name: Resolve and Verify Design UI Dependencies
        run: bash tool/resolve_design_ui.sh ${{ matrix.design }}

      - name: Check Formatting
        run: dart format --output=none --set-exit-if-changed lib test example/lib

      - name: Analyze Package, Tests, and Example
        run: bash tool/analyze.sh

      # Keep lint-tool dependencies separate from Flutter's SDK-pinned graph.
      # Validate the CLI once per SDK; plugin checks run in every matrix job.
      - name: Resolve Lint Tools
        if: matrix.design == 'latest'
        working-directory: tool/dcl
        run: dart pub get

      - name: Check Dart Code Linter Rules
        if: matrix.design == 'latest'
        run: bash tool/check_dcl.sh

      - name: Run Tests
        run: flutter test --no-pub

      # Archive checks must not re-resolve an exact lower-bound graph.
      - name: Validate Publish Dry Run
        if: matrix.sdk == 'stable' && matrix.design == 'latest'
        run: |
          set -o pipefail
          dart pub publish --dry-run 2>&1 | tee "$RUNNER_TEMP/publish-dry-run.txt"

      - name: Save Publish Dry Run for Review
        if: always() && matrix.sdk == 'stable' && matrix.design == 'latest'
        uses: actions/upload-artifact@v7
        with:
          name: publish-dry-run
          path: ${{ runner.temp }}/publish-dry-run.txt
          if-no-files-found: error

      - name: Check Whitespace
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            DIFF_BASE=$(git merge-base "$DIFF_BASE" "$DIFF_HEAD")
          elif [ "$DIFF_BASE" = 0000000000000000000000000000000000000000 ]; then
            DIFF_BASE=$(git hash-object -t tree /dev/null)
          fi
          git diff --check "$DIFF_BASE" "$DIFF_HEAD"
          git diff --check
