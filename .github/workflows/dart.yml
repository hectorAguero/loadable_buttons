name: Validate Flutter Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Flutter ${{ matrix.sdk }} / Material ${{ matrix.material }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sdk: [minimum, stable]
        material: [oldest, latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Flutter SDK
        id: flutter
        env:
          SDK_TARGET: ${{ matrix.sdk }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = ''
          if os.environ['SDK_TARGET'] == 'minimum':
              pubspec = Path('pubspec.yaml').read_text()
              match = re.search(r'^  flutter: [\'"]?>=(\d+\.\d+\.\d+)[\'"]?$', pubspec, re.MULTILINE)
              if match is None:
                  raise SystemExit('Expected an explicit >=x.y.z Flutter minimum in pubspec.yaml')
              version = match.group(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      - name: Show SDK Versions
        run: |
          flutter --version
          dart --version

      # Resolve anew after selecting the SDK, including the example's own graph.
      # Do not cache .dart_tool: it contains SDK and checkout-specific paths.
      - name: Resolve and Verify Material UI Dependencies
        run: bash tool/resolve_material_ui.sh ${{ matrix.material }}

      - name: Check Formatting
        run: dart format --output=none --set-exit-if-changed lib test example/lib

      - name: Analyze Package, Tests, and Example
        run: bash tool/analyze.sh ${{ matrix.sdk == 'minimum' && '--minimum' || '' }}

      # Modern plugins and their CLI require a newer Dart SDK than Flutter 3.44.
      # Built-in analysis still runs on minimum, with the same strict baseline.
      - name: Resolve Stable Lint Tools
        if: matrix.sdk == 'stable' && matrix.material == 'latest'
        working-directory: tool/dcl
        run: dart pub get

      - name: Check Dart Code Linter Rules
        if: matrix.sdk == 'stable' && matrix.material == 'latest'
        run: bash tool/check_dcl.sh

      - name: Run Tests
        run: flutter test --no-pub

      - name: Check Whitespace
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            DIFF_BASE=$(git merge-base "$DIFF_BASE" "$DIFF_HEAD")
          elif [ "$DIFF_BASE" = 0000000000000000000000000000000000000000 ]; then
            DIFF_BASE=$(git hash-object -t tree /dev/null)
          fi
          git diff --check "$DIFF_BASE" "$DIFF_HEAD"
          git diff --check
