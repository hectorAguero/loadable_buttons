name: loadable_buttons
description: "Async loading states for Flutter's native Material and Cupertino buttons."
version: 2.1.0
homepage: https://hectoraguero.dev/
repository: https://github.com/hectorAguero/loadable_buttons
issue_tracker: https://github.com/hectorAguero/loadable_buttons/issues

topics:
  - button
  - loading
  - material
  - ui
  - widget

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  cupertino_ui: ">=1.0.0 <2.0.0"
  flutter:
    sdk: flutter
  material_ui: ">=1.0.0 <2.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ">=10.3.0 <12.0.0"

screenshots:
  - description: 'Material buttons loading'
    path: screenshots/material.gif
  - description: 'Cupertino buttons loading'
    path: screenshots/cupertino.gif
  - description: 'Adaptive buttons rendering Material and Cupertino'
    path: screenshots/adaptive.gif
  - description: 'Button group blocking peers during an operation'
    path: screenshots/group.gif
