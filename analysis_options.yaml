# Use the same versioned baseline on minimum and stable. VGA 11.0.0 requires
# Dart 3.13 and its added rules do not exist on Dart 3.12, so the 10.3.0
# preset stays until the SDK floor moves.
include: package:very_good_analysis/analysis_options.10.3.0.yaml

analyzer:
  exclude:
    - build/**
    - '**/*.g.dart'
    - '**/*.gr.dart'
    - '**/*.mocks.dart'
    - '**/*.freezed.dart'
    - '**/*.pb.dart'
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

# Very Good Analysis owns built-in rules; these plugins add custom checks.
# Both plugins are validated on the minimum Dart 3.12 SDK and stable.
plugins:
  solid_lints: ^2.0.0
  dart_code_linter:
    version: ^4.4.2
    # DCL rules are opt-in: enable each here for the IDE and list it under
    # dart_code_linter.rules below for the CLI.
    diagnostics:
      always-remove-listener: true
      avoid-banned-imports: true
      avoid-border-all: true
      avoid-collection-methods-with-unrelated-types: true
      avoid-duplicate-exports: true
      avoid-redundant-async: true
      avoid-throw-in-catch-block: true
      avoid-unnecessary-conditionals: true
      avoid-wrapping-in-padding: true
      check-for-equals-in-render-object-setters: true
      consistent-update-render-object: true
      prefer-async-await: true
      prefer-correct-edge-insets-constructor: true
      prefer-iterable-of: true
      prefer-media-query-direct-access: true
      use-setstate-synchronously: true
      # Plugin diagnostics are enabled at the package root, including tests.
      missing-test-assertion: true
      prefer-correct-test-file-name: true

# Solid enables every rule unless it is set to false here, so list only rule
# options and deliberate opt-outs. Its built-in preset is not included.
solid_lints:
  diagnostics:
    avoid_late_keyword:
      allow_initialized: true
      ignored_types:
        - AnimationController
    avoid_unused_parameters:
      exclude_annotation:
        - freezed
        - unfreezed
    prefer_early_return:
      maximum_statements: 1
      ignore_if_case: true
    prefer_conditional_expressions:
      ignore_nested: true
    # Nullable style fallbacks and widget variants inflate build() complexity.
    # Keep the limit of 10 for callbacks, lifecycle methods, and other logic.
    cyclomatic_complexity:
      max_complexity: 10
      exclude:
        - method_name: build
    # Keep numeric logic strict while allowing ordinary layout parameters.
    no_magic_number:
      allowed: [-1, 0, 1]
      allowed_in_widget_params: true
    # The example deliberately renders all variants in one showcase method.
    function_lines_of_code:
      max_lines: 200
      exclude:
        - class_name: _HomePageState
          method_name: build
    # Material-compatible public constructors legitimately have many options.
    number_of_parameters: false
    named_parameters_ordering: false
    # Mirroring Flutter's button variants intentionally repeats widget wiring.
    avoid_duplicate_code: false
    # Copyable buttons keep related private State and widgets in one cohesive
    # file, with constructors first.
    avoid_multiple_declarations_per_file: false
    member_ordering: false
    prefer_match_file_name: false
    # Heuristics do not distinguish forwarding widgets from business logic.
    feature_envy: false
    avoid_similar_names: false

linter:
  rules:
    # Keep explicit types where they clarify fixtures and callback contracts.
    omit_local_variable_types: false
    avoid_types_on_closure_parameters: false
    # These rewrites express style preferences rather than package guarantees.
    cascade_invocations: false
    prefer_foreach: false
    sort_constructors_first: false
    prefer_single_quotes: false
    # Solid owns double literal formatting; keep explicit 0.0 layout values.
    prefer_int_literals: false
    # Flutter-style parameter assertions may omit optional error messages.
    prefer_asserts_with_message: false
    # Solid discourages uninitialized late fields outside test fixtures.
    use_late_for_private_fields_and_variables: false
    require_trailing_commas: false
    # Argument ordering is a style choice; preserve the existing widget wiring.
    sort_child_properties_last: false
    # The existing public Widget builder callback takes a positional bool.
    # Changing its signature would break package consumers.
    avoid_positional_boolean_parameters: false
    # Dart 3.12 rules beyond the VGA 10.3.0 preset that guard this package.
    avoid_annotating_with_dynamic: true
    avoid_classes_with_only_static_members: true
    avoid_implementing_value_types: true
    close_sinks: true
    do_not_use_environment: true
    library_names: true
    no_runtimetype_tostring: true
    prefer_for_elements_to_map_fromiterable: true
    prefer_iterable_wheretype: true
    prefer_void_to_null: true
    use_decorated_box: true

# CLI configuration for the DCL rules enabled above; Solid and VGA own the
# overlapping checks.
dart_code_linter:
  rules:
    - always-remove-listener
    # Version 2 uses standalone design libraries; legacy Flutter types are
    # distinct and rejected by the public API.
    - avoid-banned-imports:
        entries:
          - paths: ['.*\.dart']
            deny:
              - 'package:flutter/material\.dart'
              - 'package:flutter/cupertino\.dart'
            message: >-
              Import package:material_ui/material_ui.dart or
              package:cupertino_ui/cupertino_ui.dart instead.
    - avoid-border-all
    - avoid-collection-methods-with-unrelated-types
    - avoid-duplicate-exports
    - avoid-redundant-async
    - avoid-throw-in-catch-block
    - avoid-unnecessary-conditionals
    - avoid-wrapping-in-padding
    - check-for-equals-in-render-object-setters
    - consistent-update-render-object
    - prefer-async-await
    - prefer-correct-edge-insets-constructor
    - prefer-iterable-of
    - prefer-media-query-direct-access
    - use-setstate-synchronously
    - missing-test-assertion
    - prefer-correct-test-file-name
